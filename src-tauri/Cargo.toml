[package]
name = "gachaslop-app"
version = "0.2.0"
description = "Tray app for gacha game resets and banners"
authors = ["Reuben"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (an issue on Windows only).
name = "gachaslop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Kept deliberately small: HTTP goes through Windows' curl.exe, autostart through reg.exe, notification
# cards and the taskbar widget are drawn with Windows' own GDI and GDI+, and dates, logging, single-instance
# and popup placement are the app's own code (see src/).
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = ["tray-icon", "protocol-asset"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }

# Small and fast: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
